<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clima Xamã</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Arial,sans-serif;color:#fff;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.container{width:95%;display:flex;justify-content:space-between;align-items:center}
.left,.right{text-align:center}
.temp{font-size:82px;font-weight:bold}
.hum{font-size:34px;margin:10px 0}
.city,.cond,.date{font-size:28px}
.time{font-size:82px;font-weight:bold}
.icon{width:120px;height:120px;margin:auto}
.good{color:#62ff62}.warn{color:#ffd54f}.bad{color:#ff5c5c}
</style>
</head>
<body>
<div class="container">
<div class="left">
<svg class="icon" viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#FDB813"/><g stroke="#FDB813" stroke-width="4"><line x1="32" y1="2" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="62"/><line x1="2" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="62" y2="32"/><line x1="10" y1="10" x2="17" y2="17"/><line x1="47" y1="47" x2="54" y2="54"/><line x1="10" y1="54" x2="17" y2="47"/><line x1="47" y1="17" x2="54" y2="10"/></g></svg>
<div class="temp" id="temp">--°C</div>
<div class="hum" id="hum">💧 Umidade --%</div>
<div class="cond" id="cond">Carregando...</div>
<div class="city">Brasília - DF</div>
</div>
<div class="right">
<div class="time" id="time">00:00</div>
<div class="date" id="date"></div>
</div>
</div>
<script>
async function weather(){
 try{
 const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=-15.793889&longitude=-47.882778&current=temperature_2m,relative_humidity_2m,weather_code&timezone=America%2FSao_Paulo");
 const j=await r.json();
 document.getElementById("temp").textContent=Math.round(j.current.temperature_2m)+"°C";
 const h=j.current.relative_humidity_2m;
 const hum=document.getElementById("hum");
 hum.textContent="💧 Umidade "+h+"%";
 hum.className="hum "+(h>60?"good":h>=30?"warn":"bad");
 const mapa={0:"Céu limpo",1:"Principalmente limpo",2:"Parcialmente nublado",3:"Nublado",61:"Chuva",63:"Chuva",65:"Chuva forte",95:"Tempestade"};
 document.getElementById("cond").textContent=mapa[j.current.weather_code]||"Tempo";
 }catch(e){
 document.getElementById("cond").textContent="Sem conexão";
 }
}
function clock(){
 const d=new Date();
 time.textContent=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 date.textContent=d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
}
weather();clock();
setInterval(clock,1000);
setInterval(weather,600000);
</script>
</body>
</html>
