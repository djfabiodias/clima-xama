<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>XAMÃ Veterinária | Painel Digital</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="background"></div>

<div class="background-glow"></div>

<div class="container">

<!-- ===================================================== -->
<!-- HEADER -->
<!-- ===================================================== -->

<header class="header">

    <div class="brand">

        <img
            src="assets/logo.png"
            class="logo"
            alt="XAMÃ Veterinária">

    </div>

    <div class="header-right">

        <div
            id="clock"
            class="clock">

            00:00

        </div>

        <div
            id="date"
            class="date">

            Carregando...

        </div>

        <div
            id="greeting"
            class="greeting">

            Boa tarde!

        </div>

    </div>

</header>

<!-- ===================================================== -->
<!-- CONTEÚDO PRINCIPAL -->
<!-- ===================================================== -->

<main class="dashboard">

    <!-- ======================================== -->
    <!-- CLIMA -->
    <!-- ======================================== -->

    <section class="weather">

        <div class="weather-icon-area">

            <img

                id="weatherIcon"

                class="weather-icon"

                src="assets/icons/clear-day.svg"

                alt="Clima">

        </div>

        <div
            id="temperature"
            class="temperature">

            28°

        </div>

        <div
            id="condition"
            class="condition">

            PARCIALMENTE NUBLADO

        </div>

    </section>

    <!-- ======================================== -->
    <!-- PET -->
    <!-- ======================================== -->

    <section class="pet">

        <img

            id="petImage"

            src="assets/pets/pet1.png"

            alt="Pet do dia">

    </section>

</main>

<!-- ===================================================== -->
<!-- INFORMAÇÕES DO CLIMA -->
<!-- ===================================================== -->

<section class="weather-details">

    <div class="weather-item">

        <span class="label">

            Umidade

        </span>

        <span

            id="humidity"

            class="value">

            --%

        </span>

    </div>

    <div class="weather-item">

        <span class="label">

            Máxima

        </span>

        <span

            id="tempMax"

            class="value">

            --°

        </span>

    </div>

    <div class="weather-item">

        <span class="label">

            Mínima

        </span>

        <span

            id="tempMin"

            class="value">

            --°

        </span>

    </div>

    <div class="weather-item">

        <span class="label">

            Vento

        </span>

        <span

            id="wind"

            class="value">

            -- km/h

        </span>

    </div>

</section>

<!-- ===================================================== -->
<!-- SERVIÇOS -->
<!-- ===================================================== -->

<section class="services">

    <div class="services-title">

        Nossos Serviços

    </div>

    <div class="services-list">

        <span>🩺 Consultas</span>

        <span>•</span>

        <span>💉 Vacinação</span>

        <span>•</span>

        <span>🔬 Exames</span>

        <span>•</span>

        <span>❤️ Internação</span>

        <span>•</span>

        <span>🚑 Emergência 24 Horas</span>

    </div>

</section>

<!-- ===================================================== -->
<!-- RODAPÉ -->
<!-- ===================================================== -->

<footer class="footer">

    <div class="ticker">

        <div
            id="footerText"
            class="ticker-content">

        </div>

    </div>

</footer>

</div>

<!-- ===================================================== -->
<!-- JAVASCRIPTS -->
<!-- ===================================================== -->

<script src="js/clock.js"></script>

<script src="js/weather.js"></script>

<script src="js/pets.js"></script>

<script src="js/footer.js"></script>

<script src="js/app.js"></script>

</body>

</html>
